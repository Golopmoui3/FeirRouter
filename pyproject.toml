[project]
name = "feirrouter"
version = "1.0.0"
description = "FeirRouter — ultimate free LLM router (FCC + FreeLLMAPI + OmniRoute united)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "pydantic-settings>=2.3", "httpx>=0.27", "cryptography>=42.0", "python-multipart>=0.0.9"]

[project.scripts]
feir-server = "feirrouter.server:main"
feirrouter = "feirrouter.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
